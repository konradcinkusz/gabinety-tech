# The estate deployed by .github/workflows/deploy.yml (T-09.03, SPEC 4.3 and 9). One row per app, IN DEPLOY ORDER (SPEC 9):
# postgres, authservice, directory, booking, reputation, assistant, web-blazor (the web host). Read by scripts/deploy/*.sh; fields are whitespace-separated, no spaces inside a field.
#
# key         short name; the config is deploy/fly/<key>.fly.toml and the job is deploy-<key>   network
# fly_app     the Fly app name (SPEC 4.3)
# kind        built = we build the image (Dockerfile below) and push it to GHCR; image = the image is pinned in the app's fly.toml ([build] image)
# dockerfile  path of the Dockerfile (kind built), else -
# context     docker build context (kind built), else -
# shared      yes = also rebuilt when a shared path (the "shared" row) changes: Directory.Packages.props, ServiceDefaults, Contracts, ...
# paths       comma-separated: a path ending in / is a directory prefix, anything else an exact file. The app's own fly.toml is always included.
# smoke       how the post-deploy smoke reaches the app (scripts/deploy/smoke.sh): public = HTTPS to the public host; ssh = probe inside the machine
#             (private apps have no public listener); ssh-optional = as ssh, but no started machine is accepted (min_machines_running = 0);
#             ssh-pg = pg_isready inside the machine
# smoke_path  the health path (backends /alive, web /alive, authservice /health/ready: the same paths as the Fly checks), or -
# network     public = the app has a public listener (web, authservice, Booking's webhook path); private = deployed with --no-public-ips, reached at <app>.internal;
#             flycast = private AND a private IPv6 is allocated (`fly ips allocate-v6 --private`) so <app>.flycast resolves and its proxy can start a stopped machine (Assistant, COST.md)
#
# key         fly_app                        kind   dockerfile                             context  shared  paths                                                                        smoke         smoke_path   network
shared        -                              -      -                                      -        -       Directory.Packages.props,Directory.Build.props,global.json,src/Gabinety.ServiceDefaults/,src/Gabinety.ServiceDefaults.Edge/,src/Gabinety.Contracts/  -  -   -
postgres      gabinety-postgres-staging      image  -                                      -        no      deploy/fly/postgres.fly.toml,deploy/fly/init-databases.sql                   ssh-pg        -   private
authservice   gabinety-authservice-staging   image  -                                      -        no      deploy/fly/authservice.fly.toml                                              public        /health/ready   public
directory     gabinety-directory-staging     built  src/Gabinety.Directory/Dockerfile      .        yes     src/Gabinety.Directory/,src/Gabinety.Ranking/,deploy/fly/directory.fly.toml  ssh           /alive   private
booking       gabinety-booking-staging       built  src/Gabinety.Booking/Dockerfile        .        yes     src/Gabinety.Booking/,src/Gabinety.Billing/,src/Gabinety.Scheduling/,deploy/fly/booking.fly.toml  ssh      /alive   public
reputation    gabinety-reputation-staging    built  src/Gabinety.Reputation/Dockerfile     .        yes     src/Gabinety.Reputation/,deploy/fly/reputation.fly.toml                      ssh           /alive   private
assistant     gabinety-assistant-staging     built  src/Gabinety.Assistant/Dockerfile      .        yes     src/Gabinety.Assistant/,src/Gabinety.Llm/,deploy/fly/assistant.fly.toml      ssh-optional  /alive   flycast
# The web host: the Blazor Web App (ADR-0010, src/Gabinety.Web) replaced the Next.js app `web` at the cutover (docs/operations/CUTOVER.md). Its Fly app is NEW (gabinety-web-blazor-staging, a volume for the
# Data Protection keys), beside the old `gabinety-web-staging`, which the estate no longer deploys: it keeps running as the rollback until the owner retires it (CUTOVER.md section 3). A public app with a websocket: smoke /alive over HTTPS.
web-blazor    gabinety-web-blazor-staging    built  src/Gabinety.Web/Dockerfile            .        yes     src/Gabinety.Web/,deploy/fly/web-blazor.fly.toml                              public        /alive       public
