# reputation (T-09.02, SPEC 4.3): Reviews and reputation summaries; owns reputationdb.
# Deploy (T-09.03 automates this): fly deploy --config deploy/fly/reputation.fly.toml --ha=false   (run from the repository root)
# Nothing secret and no real hostname lives in this file. Placeholders in <angle brackets> are filled by the owner after T-09.01 (Fly organisation) and the domain decision.
# Fly ignores a Dockerfile HEALTHCHECK, so the checks below repeat what the Dockerfile asks.

app = "gabinety-reputation-staging"
primary_region = "fra"

[build]
  # Both paths are relative to THIS file. The context is the repository root (the Dockerfile copies src/** and the solution files).
  dockerfile = "../../src/Gabinety.Reputation/Dockerfile"
  context = "../.."

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_HTTP_PORTS = "8080"
  TZ = "Europe/Warsaw"
  Database__Provider = "PostgreSQL"
  # NOT set here, on purpose: Environment__Kind and GABINETY_FAKE (CONTRACTS 10.4: the /internal/v1/test and demo endpoints must stay unmapped in staging).
  # Authservice is public (it is the JWT issuer): the same URL the web app and every validator use.
  Identity__Authority = "https://<authservice-public-host>"
  Identity__Audience = "gabinety"
  Backend__Directory = "http://gabinety-directory-staging.internal:8080"
  Backend__Booking = "http://gabinety-booking-staging.internal:8080"
  # Assistant may be stopped (min 0): only .flycast goes through the proxy that starts it (port 80 on flycast). Needs `fly ips allocate-v6 --private --app gabinety-assistant-staging`.
  Backend__Assistant = "http://gabinety-assistant-staging.flycast"
# Secrets (NOT here), set once with `fly secrets set --app gabinety-reputation-staging`:
#   ConnectionStrings__reputationdb
#   Internal__Keys__Directory, Internal__Keys__Booking, Internal__Keys__Assistant   (the keys Reputation sends, one per callee; F-03)
#   optional Internal__Callers__Owner                                               (the owner's key for the RUNBOOK 8 erasure hook)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  # No public listener (F-03; deploy with --no-public-ips, the workflow then asserts no public address). Reached at .internal (6PN, no edge headers). Min 1: the summary push and triage retries are jobs (SPEC 4.3).

  # Liveness only (/alive runs no dependency check, P7); /health reports optional dependencies and must never fail a deploy. Always on (jobs).
  [[http_service.checks]]
    method = "GET"
    path = "/alive"
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
